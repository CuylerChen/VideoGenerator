<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1080">
    <meta name="template:media-height" content="1920">
    <style>
        html, body { margin: 0; padding: 0; }
        body {
            width: 1080px;
            height: 1920px;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #111;
            color: #fff;
        }
        .page { width: 1080px; height: 1920px; position: relative; }
        .media { position: absolute; inset: 0; }
        .media img { width: 100%; height: 100%; object-fit: contain; }
        .shade {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,.05) 30%, rgba(0,0,0,.72));
        }
        .title { position: absolute; top: 80px; left: 60px; right: 60px; font-size: 54px; font-weight: 700; text-align: center; }
        .caption { position: absolute; left: 60px; right: 60px; bottom: 180px; font-size: 64px; line-height: 1.35; text-align: center; }
        .slogan { position: absolute; left: 60px; right: 60px; bottom: 70px; font-size: 32px; text-align: center; }
    </style>
</head>
<body>
    <div class="page">
        <div class="media" id="media"></div>
        <div class="shade"></div>
        <div class="title">{{title}}</div>
        <div class="caption">{{text}}</div>
        <div class="slogan">每天发现一个实用好物，这里是好物研究所！</div>
    </div>
    <script>
        (function () {
            var imageUrl = "{{image}}";
            if (imageUrl && imageUrl.trim() && imageUrl !== "None") {
                var img = document.createElement("img");
                img.src = imageUrl;
                document.getElementById("media").appendChild(img);
            }
        })();
    </script>
</body>
</html>
